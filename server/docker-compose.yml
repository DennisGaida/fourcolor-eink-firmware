# Example deployment of the presence/calendar bridge as a container.
#
# Usage:
#   cp .env.example .env && fill in real values
#   docker compose up -d
#
# The image is also published to GHCR on every change under server/ (see
# ../.github/workflows/build-bridge.yml). Its version is derived
# automatically from Conventional Commits touching server/ (no file to bump
# by hand) and tagged in git as bridge-vX.Y.Z - swap `build:` for `image:
# ghcr.io/<owner>/busylight-bridge:<version>` (or `:latest`) below to use
# that instead of building locally.
services:
  bridge:
    build: .
    # image: ghcr.io/dennisgaida/busylight-bridge:latest
    container_name: busylight-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Uncomment to run the all-Home-Assistant alternative instead of the
    # default calendar_bridge.py (see Dockerfile / presence_bridge.py):
    # command: ["presence_bridge.py", "--port", "8080"]
    #
    # Docker secrets alternative for CALENDAR_SOURCE_SECRET/HA_TOKEN
    # instead of putting them in .env: every env var read by the bridge
    # scripts also accepts a `<VAR>_FILE` variant pointing at a file (see
    # server/env_file.py's getenv()), which is exactly how Docker/Swarm/
    # Compose secrets get mounted (as /run/secrets/<secret_name>).
    # Uncomment below (and drop the plaintext values from .env) to use it:
    # environment:
    #   - CALENDAR_SOURCE_SECRET_FILE=/run/secrets/calendar_source_secret
    #   - HA_TOKEN_FILE=/run/secrets/ha_token
    # secrets:
    #   - calendar_source_secret
    #   - ha_token
    #
    # Reverse proxy (e.g. Traefik) via Docker labels/service discovery:
    # the container must be explicitly attached to the proxy's Docker
    # network, not just labeled for it - Traefik resolves the container's
    # IP via the Docker API regardless, but can't route to it unless
    # they share a network, and silently 502/504s instead of erroring
    # loudly. Uncomment both this network attachment and the block below,
    # substituting the proxy network's real (Compose-project-prefixed)
    # name from `docker network ls`:
    # networks:
    #   - default
    #   - traefik_proxy
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=traefik_proxy"
    #   - "traefik.http.routers.busylight-svc.rule=Host(`busylight.example.invalid`)"
    #   - "traefik.http.services.busylight-svc.loadbalancer.server.port=8080"

# networks:
#   default: {}
#   traefik_proxy:
#     external: true
#     name: <real_traefik_network_name>  # from `docker network ls`

# secrets:
#   calendar_source_secret:
#     file: ./secrets/calendar_source_secret.txt
#   ha_token:
#     file: ./secrets/ha_token.txt

